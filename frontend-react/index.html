<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Company Logo in Browser Tab (Favicon) -->
    <link rel="icon" type="image/png" href="/GBGX_logo_black_transparent.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Browser Title -->
    <title>GBGX | Electric Mobility & EV Scooters India</title>
    <style>
  @keyframes gbgxRotate3D {
    0% { transform: perspective(800px) rotateY(0deg) scale(0.95); }
    50% { transform: perspective(800px) rotateY(180deg) scale(1.05); }
    100% { transform: perspective(800px) rotateY(360deg) scale(0.95); }
  }

  @keyframes gbgxZoomIn {
    0% { transform: scale(0.6); opacity: 0; filter: blur(6px); }
    60% { transform: scale(1.15); opacity: 1; filter: blur(0px); }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes gbgxScanline {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(100%); }
  }
</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
